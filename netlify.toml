[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "http://manaakimidwives.co.nz/*"
  to = "https://manaakimidwives.co.nz/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.manaakimidwives.co.nz/*"
  to = "https://manaakimidwives.co.nz/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
